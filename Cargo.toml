[package]
name = "crescent-cli"
version = "0.5.1"
edition = "2021"
exclude = [".github", "tests", "tools"]
categories = ["command-line-utilities"]
description = "A wrapper for init systems to help quickly create and manage services."
keywords = ["process-manager", "tui"]
repository = "https://github.com/Kyagara/crescent"
homepage = "https://github.com/Kyagara/crescent"
license = "Apache-2.0"
rust-version = "1.74"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[profile.release]
# These options result in a smaller binary.
lto = true
codegen-units = 1
opt-level = "z"

[[bin]]
name = "cres"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.94"

clap = { version = "4.5.23", features = ["derive"] }
clap_complete = "4.5.40"
sysinfo = { version = "0.30.13", default-features = false }

# tui and attach command
log = "0.4.22"
ratatui = { version = "0.29.0", features = [
    "crossterm",
], default-features = false }
tui-input = "0.11.1"
tui-logger = { version = "0.14.0", features = [
    "crossterm",
], default-features = false }
